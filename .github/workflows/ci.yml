name: Prefect Data Engineering CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Run Unit Tests & Validate Deployments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Lint Verification
        run: |
          python -m py_compile sesi-09/pipeline_code.py
          python -m py_compile sesi-09/test_pipeline.py

      - name: Run Pytest Test Suite
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          pytest sesi-09/test_pipeline.py -v --tb=short

      - name: Verify Flow Deployability
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from pipeline_code import financial_tax_pipeline; print('Flow loaded successfully:', financial_tax_pipeline.name)"
        working-directory: sesi-09
