name: Prefect Data Engineering CI Pipeline

# Trigger saat ada push atau pull request ke branch main/master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Run Unit Tests & Validate Deployments
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment (disarankan Python 3.12 untuk stabilitas binary)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Linting & Syntax Check
      - name: Syntax & Lint Verification
        run: |
          python -m py_compile sesi-09/pipeline_code.py
          python -m py_compile sesi-09/test_pipeline.py

      # 5. Eksekusi Test Suite (pytest)
      - name: Run Pytest Test Suite
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          pytest sesi-09/test_pipeline.py -v --tb=short

      # 6. Sanity Check Deployment Definitions
      - name: Verify Flow Deployability
        run: |
          python -c "from sesi_09_pipeline import financial_tax_pipeline; print('Flow loaded successfully:', financial_tax_pipeline.name)"
        working-directory: sesi-09
